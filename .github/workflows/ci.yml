name: CI - Software

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Run software tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: software/requirements.txt

      - name: Install system dependencies
        # Os testes de regressão do histórico (test_history_via_keyboard.py) e o
        # dispatch do entrypoint instanciam/importam janelas Tk reais:
        #   - xvfb      -> display virtual (o runner é headless);
        #   - python3-tk -> libtk8.6.so/libtcl8.6.so, que o Python do
        #     setup-python carrega em runtime. O runner do GitHub já as traz,
        #     mas a imagem do `act` (execução local do workflow) não — sem isso
        #     o import falha com "libtk8.6.so: cannot open shared object file".
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r software/requirements.txt

      - name: Run tests
        run: xvfb-run -a python -m unittest discover -s software/tests -t . -v
