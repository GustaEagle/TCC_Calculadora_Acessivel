# Saída de áudio padrão do ALSA no Raspberry Pi 4B.
#
# O espeak-ng (via pyttsx3) reproduz pela placa ALSA padrão. No Pi 4 há duas
# saídas analógicas/HDMI possíveis; aqui fixamos o card 0. Ajuste "card 0" para
# a saída desejada após checar `aplay -l` no hardware:
#   - HDMI do LCD/monitor  -> normalmente card 0 (vc4-hdmi-0) ou 1 (vc4-hdmi-1)
#   - jack 3,5 mm          -> card "Headphones" (bcm2835)
#
# Diferente do uso em Docker (que roteava para o PulseAudio do host), no aparelho
# o som vai direto para o hardware: sem PulseAudio, só ALSA (mais enxuto p/ RNF-06).

defaults.pcm.card 0
defaults.ctl.card 0
