name: CI - Software

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Run software tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: software/requirements.txt

      - name: Install system dependencies
        # Os testes de regressão do histórico (test_history_via_keyboard.py)
        # instanciam janelas Tk reais, e o runner do GitHub é headless. O Xvfb
        # dá um display virtual para eles rodarem de verdade, em vez de os
        # desativarmos e perdermos a cobertura da regressão.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r software/requirements.txt

      - name: Run tests
        run: xvfb-run -a python -m unittest discover -s software/tests -t . -v
