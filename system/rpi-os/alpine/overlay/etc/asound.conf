# Saída de áudio do produto: o JACK DE 3,5 mm DO PRÓPRIO RASPBERRY PI.
#
# Isto é decisão de produto, não preferência de configuração:
#
#   - Os materiais do TCC preveem um cabo TRS de 90° ligado à saída de áudio do
#     Pi e levado por dentro do gabinete até uma abertura, para fone de ouvido
#     (docs/produto/materiais-e-metodos-tcc.md §5). O caminho físico do som sai
#     da placa, não do painel.
#
#   - O áudio tem de sobreviver à ausência de vídeo. Em modo somente áudio
#     (RF-04) e depois de apagar as telas com Ctrl + AC (WRN-013), a voz é o
#     único canal que resta — e é exatamente o modo de uso de quem não enxerga
#     a tela. Se o som saísse pelo HDMI, desligar a saída de vídeo levaria a voz
#     junto e o aparelho ficaria mudo justamente quando mais depende dela.
#
# O jack é a placa bcm2835, que o kernel do Pi nomeia "Headphones" e que só
# existe com dtparam=audio=on (ver boot/usercfg.txt).
#
# Selecionada PELO NOME, não pelo índice: a ordem de enumeração muda conforme a
# ordem de carga dos módulos, e as placas HDMI (vc4-hdmi-0 / vc4-hdmi-1) podem
# ficar à frente — o "card 0" anterior apontava para o HDMI sem ninguém ter
# escolhido isso.
#
# O "!" é obrigatório: o alsa.conf já define defaults.pcm.card como NÚMERO (0), e
# atribuir um texto a ele ("card is not a string") invalida a configuração do
# ALSA inteira — nenhum programa toca som em placa nenhuma. Com "!" o valor é
# substituído, e aí o nome é aceito.
#
# Conferir no hardware com `aplay -l`. Se o kernel nomear a placa de outra forma
# (firmwares antigos usavam "ALSA"), troque o nome nas duas linhas — não volte
# a usar índice.
defaults.pcm.!card "Headphones"
defaults.ctl.!card "Headphones"

# Quem consome isto é a voz: speech.py -> pyttsx3 -> libespeak-ng, que só
# sintetiza (AUDIO_OUTPUT_RETRIEVAL) para um WAV temporário; quem toca é o
# `aplay` chamado pelo driver do pyttsx3, e ele usa o PCM padrão definido aqui.
#
# Diferente do uso em Docker (que roteava para o PulseAudio do host), no aparelho
# o som vai direto para o hardware: sem PulseAudio, só ALSA (mais enxuto p/ RNF-06).
